set timeout=30
set gfxmode=1280x720,auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm
background_image /grub/haar-splash.png
set color_normal=white/black
set menu_color_normal=white/black
set menu_color_highlight=black/cyan
menuentry "Haar splash test: boot entry 1" { true }
menuentry "Haar splash test: boot entry 2" { true }
