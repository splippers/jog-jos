# JOG / JOS netboot grub.cfg — staged by jog-copy-signed-ubuntu-efi-to-tftpboot.sh
# alongside Ubuntu's signed shimx64.efi / grubx64.efi.
#
# Chain: firmware -> shimx64.efi (Microsoft-signed) -> grubx64.efi (Canonical-signed)
# -> this file -> vmlinuz (Canonical-signed, staged by
# jog-copy-signed-ubuntu-kernel-to-tftpboot.sh) -> initrd.img (JOS's own, unsigned —
# see jos-client/build/build-initrd.sh and jos-client/docs/architecture.md).
#
# GRUB verifies the kernel PE image against shim's embedded vendor cert; it does
# not separately verify the initrd. This is the whole point of this chain — see
# fogproject docs/adr/0045 for why, and its "Verification needed" section for
# what to confirm on real firmware before relying on this in the field:
# does GRUB really not refuse the unsigned initrd here, on real hardware, under
# real Secure Boot enforcement? Test before trusting this file.
#
# net_default_server is set automatically by GRUB when it is itself loaded over
# TFTP — which it will be, chained through shim from dnsmasq's dhcp-boot. No
# per-site IP is hardcoded here; this file is the same on every JOG laptop.

set timeout=3
set default=0

if [ -z "$net_default_server" ]; then
  # Fallback only: should not be hit in the normal PXE-chained case above.
  echo "net_default_server not set by GRUB's own netboot - falling back to DHCP"
  net_bootp
fi

menuentry "JOS (Secure Boot)" {
  echo "Loading JOS kernel from (tftp,${net_default_server})/ubuntu-signed/ ..."
  linux (tftp,${net_default_server})/ubuntu-signed/vmlinuz ip=dhcp rd.shell=0 quiet
  initrd (tftp,${net_default_server})/ubuntu-signed/initrd.img
}
